name: Deploy learning site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate page
        run: |
          python3 validate.py
          npm test
          rustc --edition=2021 --test reference.rs -o /tmp/lesson-tests
          /tmp/lesson-tests
          rustc --edition=2021 --test lesson-03-reference.rs -o /tmp/lesson03-tests
          /tmp/lesson03-tests
          rustc --edition=2021 --test lesson-03-starter.rs -o /tmp/lesson03-starter-tests
          if /tmp/lesson03-starter-tests > /tmp/lesson03-starter-output.txt 2>&1; then
            echo "Starter unexpectedly passed before implementation"
            exit 1
          fi
          grep -q "0 passed; 10 failed" /tmp/lesson03-starter-output.txt
          grep -q "not yet implemented" /tmp/lesson03-starter-output.txt
          echo "PASS: starter compiles and all ten tests fail at the exercise placeholder"
          rustc --edition=2021 --test lesson-04-reference.rs -o /tmp/lesson04-tests
          /tmp/lesson04-tests
          rustc --edition=2021 --test lesson-04-starter.rs -o /tmp/lesson04-starter-tests
          if /tmp/lesson04-starter-tests > /tmp/lesson04-starter-output.txt 2>&1; then
            echo "Lesson 04 starter unexpectedly passed before implementation"
            exit 1
          fi
          grep -q "0 passed; 18 failed" /tmp/lesson04-starter-output.txt
          grep -q "not yet implemented" /tmp/lesson04-starter-output.txt
          echo "PASS: Lesson 04 starter compiles and all 18 tests fail at the exercise placeholder"
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html lesson-02.html lesson-03.html starter.rs reference.rs lesson-03-starter.rs lesson-03-reference.rs lesson-04.html lesson-04-starter.rs lesson-04-reference.rs lesson-05.html lesson-06.html lesson-07.html _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

